<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crear cuenta · Maqueta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap">
<link rel="stylesheet" href="maqueta.css">
<script src="maqueta.js" defer></script>
</head>
<body>
<header class="nav"><div class="wrap nav-in">
  <a class="brand" href="home.html"><span class="logo">S</span>Spring Boot + Angular</a>
  <nav class="nav-links" aria-label="Principal">
    <a class="nav-link" href="login.html">Ingresar</a>
    <a class="btn btn-primary btn-sm" href="register.html">Registrarse</a>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="Cambiar tema">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </nav>
</div></header>

<main class="wrap" style="--w:34rem">
  <div class="states" role="navigation" aria-label="Estados de la maqueta">
    Estado de la pantalla:
    <a class="chip" href="#normal">Normal</a><a class="chip" href="#error">Error</a><a class="chip" href="#loading">Cargando</a>
  </div>

  <section class="card card-auth">
    <h1 style="font-size:1.8rem">Crear cuenta</h1>
    <p class="muted" style="margin-top:6px">Registrate para empezar a usar la aplicación.</p>

    <form class="stack" style="margin-top:24px" onsubmit="return false">
      <label class="field" for="username">Usuario
        <input class="input" id="username" name="username" autocomplete="username" value="ana.perez">
      </label>
      <label class="field" for="password">Contraseña
        <input class="input" id="password" name="password" type="password" autocomplete="new-password" value="contraseña123">
        <span class="hint" style="display:block">Mínimo 8 caracteres.</span>
      </label>

      <p class="alert" role="alert" data-show="error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        Ese usuario ya existe. Probá con otro nombre.
      </p>

      <button class="btn btn-primary btn-block btn-submit" type="submit">
        <span data-hide="loading">Registrarse</span>
        <span data-show="loading" style="display:none;align-items:center;gap:8px"><i class="spinner"></i>Creando…</span>
      </button>
    </form>

    <p class="muted" style="margin-top:20px;font-size:14px">¿Ya tenés cuenta? <a href="login.html">Ingresá</a></p>
  </section>
</main>
<style>html[data-state="loading"] span[data-show~="loading"]{display:inline-flex !important}</style>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dashboard · Maqueta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap">
<link rel="stylesheet" href="maqueta.css">
<script src="maqueta.js" defer></script>
</head>
<body>
<header class="nav"><div class="wrap nav-in">
  <a class="brand" href="home.html"><span class="logo">S</span>Spring Boot + Angular</a>
  <nav class="nav-links" aria-label="Principal">
    <a class="nav-link" href="dashboard.html" aria-current="page">Dashboard</a>
    <a class="nav-link" href="items.html">Items</a>
    <span class="user-chip"><span class="avatar">A</span>ana.perez</span>
    <button class="btn btn-ghost btn-sm" type="button">Salir</button>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="Cambiar tema">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </nav>
</div></header>

<main class="wrap" style="--w:60rem">
  <div class="page-head">
    <div>
      <h1>Hola, <span class="grad-text">ana.perez</span></h1>
      <p class="muted" style="margin-top:6px">Sesión iniciada como <strong style="color:var(--fg)">ana.perez</strong>.</p>
    </div>
  </div>

  <div class="grid">
    <section class="card stack" style="background-image:var(--grad-soft)">
      <h2>Tu sesión</h2>
      <p class="muted" style="font-size:14px">Roles asignados a tu usuario</p>
      <ul style="list-style:none;margin:0;padding:0;display:flex;gap:8px;flex-wrap:wrap">
        <li><span class="badge">USER</span></li>
        <li><span class="badge">ADMIN</span></li>
      </ul>
    </section>

    <section class="card stack">
      <h2>Items</h2>
      <p class="muted" style="font-size:14px">Creá, editá y eliminá los items de ejemplo.</p>
      <a class="btn btn-primary" href="items.html">Ir a Items</a>
    </section>
  </div>
</main>
</body>
</html>

spring:
  application:
    name: student
  config:
    import: "optional:file:.env.properties,optional:configserver:"
  threads:
    virtual:
      enabled: true
  docker:
    compose:
      enabled: false
      lifecycle-management: start_only
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      auto-commit: false
      # Con Virtual Threads el pool es el límite real: max_instancias x pool < max_connections de Cloud SQL
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
        jdbc:
          batch_size: 25
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          fail_on_pagination_over_collection_fetch: true
          in_clause_parameter_padding: true
        connection:
          provider_disables_autocommit: true
  flyway:
    clean-disabled: true
    validate-on-migrate: true
    # Los datos de ejemplo (db/seed) solo existen en el perfil local: no es un error que otro perfil no los vea.
    ignore-migration-patterns: "repeatable:missing"

server:
  port: ${PORT:8080}
  compression:
    # SERVER_COMPRESSION_ENABLED=false si hay LB/CDN delante que ya comprime
    enabled: ${SERVER_COMPRESSION_ENABLED:true}
    min-response-size: 1024
    mime-types: application/json,application/problem+json,application/xml,text/html,text/plain,text/css,text/javascript
  http2:
    enabled: true
  shutdown: graceful

logging:
  level:
    root: INFO
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  include-application-name: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    git:
      mode: simple
  tracing:
    export:
      enabled: ${TRACING_ENABLED:${OBSERVABILITY_ENABLED:false}}
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    metrics:
      export:
        enabled: ${OBSERVABILITY_ENABLED:false}
        url: ${METRICS_EXPORT_URL:http://localhost:4318/v1/metrics}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${TRACES_EXPORT_URL:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${LOGS_EXPORT_URL:http://localhost:4318/v1/logs}
  logging:
    export:
      otlp:
        enabled: ${OBSERVABILITY_ENABLED:false}

app:
  auth:
    enabled: ${AUTH_ENABLED:true}
    secure-cookie: true
    registration-enabled: false
  infra:
    security:
      mode: jwt
    jwt:
      secret: ${JWT_SECRET}
    core:
      enabled: true
    errors:
      enabled: true
      include-stack-trace: false
    config:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: local
  main:
    lazy-initialization: true
  docker:
    compose:
      enabled: true
  flyway:
    clean-disabled: false
    locations: classpath:db/migration,classpath:db/seed
  jpa:
    show-sql: true
    properties:
      hibernate:
        generate_statistics: true
        log_slow_query: 1000

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

app:
  auth:
    secure-cookie: false
    registration-enabled: true
  infra:
    jwt:
      secret: local-dev-only-secret-not-for-production-0123456789
    errors:
      include-stack-trace: true

---
spring:
  config:
    activate:
      on-profile: production

bootui:
  enabled: false

management:
  endpoint:
    health:
      show-details: when_authorized

app:
  infra:
    errors:
      include-stack-trace: false

# Dependencias locales segun las capacidades elegidas. `task local-up` o simplemente `task run`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
  lgtm:
    # Opcional: solo con `task obs_up` (profile observability). Grafana en http://localhost:3000 (admin/admin)
    profiles: ["observability"]
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

version: '3'

vars:
  MVN: '{{if eq OS "windows"}}mvn.cmd{{else}}mvn{{end}}'
  NPM: '{{if eq OS "windows"}}npm.cmd{{else}}npm{{end}}'
  IMAGE_NAME: '{{default "gallardofabian/student" .IMAGE_NAME}}'
  VERSION:
    sh: '{{.MVN}} -B -q help:evaluate -Dexpression=project.version -DforceStdout'

tasks:
  default:
    desc: Muestra la guia de tareas (usa `task test` para correr las pruebas)
    silent: true
    cmds:
      - task: ayuda

  ayuda:
    desc: Guia rapida de las tareas, ordenadas por fase de trabajo
    silent: true
    cmds:
      - 'echo ""'
      - 'echo "FASES DEL TRABAJO - lo que mas vas a usar"'
      - 'echo "  1. task setup          primera vez en una maquina (instala front y e2e en paralelo)"'
      - 'echo "  2. task dev            desarrollar: levanta la app (DESTINO=local o DESTINO=cloud para ver Grafana)"'
      - 'echo "  3. task test           validar: formatea y corre todos los tests con cobertura"'
      - 'echo "  4. task ship           publicar: verifica y sube la imagen (pide confirmacion)"'
      - 'echo "  5. task post_deploy    despues de desplegar: e2e en Render y acceso a Grafana Cloud (en paralelo)"'
      - 'echo "  6. task mantenimiento  revision periodica: dependencias y SBOM (en paralelo)"'
      - 'echo "  7. task fin            cerrar el dia: baja contenedores, Docker Desktop y WSL (pide confirmacion)"'
      - 'echo ""'
      - 'echo "SUELTAS - por si las necesitas"'
      - 'echo "  run, run_obs, run_cloud, up, down, verify, e2e, e2e_render, obs_check, e2e_report, front_dev, front_test,"'
      - 'echo "  new_entity, coverage, sbom, deps_updates, doctor, db_reset, clean,"'
      - 'echo "  k8s_local, k8s_cloud, k8s_apply, k8s_check, k8s_grafana_secret, mutation, hooks_install"'
      - 'echo ""'
      - 'echo "Lista completa con descripciones: task --list"'

  setup:
    desc: "Primera vez en una maquina: instala front y e2e (en paralelo) y revisa las herramientas"
    deps: [front_install, e2e_install]
    cmds:
      - task: doctor

  up:
    desc: Sube todo lo local en una sola orden (Postgres y la pila de Grafana)
    cmds:
      - docker compose --profile observability up -d --wait

  down:
    desc: Baja todo lo local en una sola orden (conserva los datos de Postgres)
    cmds:
      - docker compose --profile observability stop

  dev:
    desc: "Desarrollar: levanta la app. DESTINO=local (Grafana local) o DESTINO=cloud (Grafana Cloud); sin DESTINO, sin telemetria"
    vars:
      DESTINO: '{{default "ninguno" .DESTINO}}'
    cmds:
      - task: '{{if eq .DESTINO "local"}}run_obs{{else if eq .DESTINO "cloud"}}run_cloud{{else}}run{{end}}'

  post_deploy:
    desc: "Despues de desplegar: e2e contra Render y acceso a Grafana Cloud, en paralelo"
    deps: [e2e_render, obs_check]

  mantenimiento:
    desc: "Revision periodica: actualizaciones de dependencias y SBOM (en paralelo) y estado de las herramientas"
    deps: [deps_updates, sbom]
    cmds:
      - task: doctor

  fin:
    desc: "Cerrar el dia: baja contenedores, apaga Docker Desktop y WSL (pide confirmacion)"
    prompt: "Esto baja los contenedores, apaga Docker Desktop y ejecuta wsl --shutdown. Continuar?"
    cmds:
      - task: down
      - cmd: docker desktop stop
        ignore_error: true
      - cmd: wsl --shutdown
        platforms: [windows]
        ignore_error: true
      - 'echo "Listo: contenedores, Docker Desktop y WSL apagados"'

  ship:
    desc: "Publica una version: verifica (tests y cobertura) y sube la imagen. Despues: Manual Deploy en Render"
    prompt: "Esto publica {{.IMAGE_NAME}}:{{.VERSION}} en el registro. Continuar?"
    cmds:
      - task: verify
      - task: push_image
      - 'echo "Imagen publicada. Siguiente - Manual Deploy en Render y luego task e2e_render"'

  e2e_render:
    desc: Pruebas de punta a punta contra el servicio publicado en Render
    cmds:
      - task: e2e
        vars:
          E2E_ENV: render

  obs_check:
    desc: "Comprueba el acceso a Grafana Cloud (requiere GRAFANA_OTLP_ENDPOINT, GRAFANA_OTLP_INSTANCE_ID y GRAFANA_OTLP_TOKEN)"
    cmds:
      - python tools/grafana_check.py

  format:
    desc: Formatea el código (Spotless / palantir-java-format)
    cmds:
      - "{{.MVN}} -B spotless:apply"

  test:
    desc: Formatea y corre todos los tests
    deps: [format]
    cmds:
      - "{{.MVN}} -B clean verify"

  verify:
    desc: Verificación sin formatear (la usa CI)
    cmds:
      - "{{.MVN}} -B -ntp verify"

  run:
    desc: Levanta la app con perfil local (usa compose.yml via spring-boot-docker-compose)
    cmds:
      - "{{.MVN}} -B spring-boot:run -Dspring-boot.run.profiles=local"

  run_tc:
    desc: Levanta la app con Testcontainers (sin compose) vía TestApplication
    cmds:
      - "{{.MVN}} -B spring-boot:test-run -Dspring-boot.run.profiles=local"

  build_image:
    desc: Construye la imagen con Jib (IMAGE_NAME configurable)
    cmds:
      - "{{.MVN}} -B -DskipTests package jib:dockerBuild -Djib.to.image={{.IMAGE_NAME}}:{{.VERSION}}"

  push_image:
    desc: Construye y publica la imagen (requiere login previo al registry)
    cmds:
      - "{{.MVN}} -B -DskipTests package jib:build -Djib.to.image={{.IMAGE_NAME}}:{{.VERSION}}"

  obs_up:
    desc: Levanta Grafana, Loki, Tempo y Prometheus (profile observability) en http://localhost:3000
    cmds:
      - docker compose --profile observability up -d --wait lgtm

  obs_down:
    desc: Baja la pila de observabilidad (no toca Postgres)
    cmds:
      - docker compose --profile observability stop lgtm

  run_obs:
    desc: Levanta la pila de observabilidad y la app con la telemetria activada
    env:
      OBSERVABILITY_ENABLED: "true"
    cmds:
      - task: obs_up
      - "{{.MVN}} -B spring-boot:run -Dspring-boot.run.profiles=local"

  run_cloud:
    desc: "Levanta la app enviando la telemetria a Grafana Cloud (requiere GRAFANA_OTLP_ENDPOINT, GRAFANA_OTLP_INSTANCE_ID y GRAFANA_OTLP_TOKEN)"
    env:
      GRAFANA_OTLP_AUTH:
        sh: python tools/grafana_auth.py
    cmds:
      - "{{.MVN}} -B spring-boot:run -Dspring-boot.run.profiles=local,grafana-cloud"

  local-up:
    desc: Levanta las dependencias locales (compose.yml)
    cmds:
      - docker compose up -d --wait

  local-down:
    desc: Baja las dependencias locales
    cmds:
      - docker compose down

  local-logs:
    desc: Logs de las dependencias locales
    cmds:
      - docker compose logs -f

  mutation:
    desc: "Mutation testing (PIT) sobre domain/ y application/; reporte en target/pit-reports/index.html (tarda varios minutos)"
    cmds:
      - "{{.MVN}} -B -Pmutation -Dskip.frontend=true test-compile org.pitest:pitest-maven:mutationCoverage"

  hooks_install:
    desc: "Activa los hooks de git del repo (.githooks): revisa manifiestos y formato Java antes de cada commit"
    cmds:
      - git config core.hooksPath .githooks

  _k8s_guard:
    internal: true
    requires:
      vars: [EXPECTED]
    cmds:
      - |
        ctx=$(kubectl config current-context 2>/dev/null)
        if [ "$ctx" != "{{.EXPECTED}}" ]; then
          echo "Contexto de kubectl: '$ctx'. Se esperaba '{{.EXPECTED}}'. Abortado, no se toco nada." >&2
          exit 1
        fi

  k8s_apply:
    desc: "Aplica un overlay al cluster indicado: task k8s_apply CONTEXT=<contexto> [OVERLAY=deployment/<ruta>]; aborta si el contexto actual no coincide o si el overlay trae CHANGE_ME"
    requires:
      vars: [CONTEXT]
    vars:
      TARGET: '{{default "deployment/base" .OVERLAY}}'
    cmds:
      - task: _k8s_guard
        vars: {EXPECTED: '{{.CONTEXT}}'}
      - python tools/check_manifests.py --placeholders {{.TARGET}}
      - kubectl --context={{.CONTEXT}} apply -k {{.TARGET}}

  k8s_local:
    desc: "Despliega en minikube con skaffold (overlay local, Postgres como pod). Aborta si el contexto no es minikube"
    cmds:
      - task: _k8s_guard
        vars: {EXPECTED: minikube}
      - skaffold run --kube-context minikube

  k8s_check:
    desc: "Renderiza base, local y local-cloud con kustomize y revisa que la telemetria y el Secret queden coherentes (lo mismo que corre el CI)"
    cmds:
      - python tools/check_manifests.py

  k8s_grafana_secret:
    desc: "Crea/actualiza el Secret grafana-cloud en minikube (requiere GRAFANA_OTLP_ENDPOINT, GRAFANA_OTLP_INSTANCE_ID y GRAFANA_OTLP_TOKEN)"
    env:
      GRAFANA_OTLP_AUTH:
        sh: python tools/grafana_auth.py
    cmds:
      - task: _k8s_guard
        vars: {EXPECTED: minikube}
      - 'kubectl --context minikube create secret generic grafana-cloud --from-literal=GRAFANA_OTLP_ENDPOINT="$GRAFANA_OTLP_ENDPOINT" --from-literal=GRAFANA_OTLP_AUTH="$GRAFANA_OTLP_AUTH" --dry-run=client -o yaml | kubectl --context minikube apply -f -'

  k8s_cloud:
    desc: "Despliega en minikube con skaffold enviando la telemetria a Grafana Cloud (corre antes k8s_grafana_secret)"
    cmds:
      - task: _k8s_guard
        vars: {EXPECTED: minikube}
      - task: k8s_grafana_secret
      - skaffold run -p cloud --kube-context minikube

  front_install:
    desc: Instala las dependencias del front (npm ci). Requiere Node 24 (mise install)
    dir: frontend
    cmds:
      - "{{.NPM}} ci"

  front_dev:
    desc: Front con recarga en vivo en http://localhost:4200 (proxy de /api al backend en 8080)
    dir: frontend
    cmds:
      - "{{.NPM}} start"

  front_test:
    desc: Tests de Angular (Vitest)
    dir: frontend
    cmds:
      - "{{.NPM}} test -- --watch=false"

  e2e_install:
    desc: Instala Playwright y Chromium para las pruebas de punta a punta (una vez; descarga cientos de MB)
    dir: e2e
    cmds:
      - "{{.NPM}} ci"
      - "{{.NPM}} run install-browsers"

  e2e:
    desc: "Pruebas de punta a punta. Ambiente en e2e/environments.json: task e2e (local) o task e2e E2E_ENV=render"
    dir: e2e
    env:
      E2E_ENV: '{{default "local" .E2E_ENV}}'
    cmds:
      - "{{.NPM}} test"

  e2e_report:
    desc: Abre el reporte HTML de la ultima corrida de e2e en el navegador (Ctrl+C para cerrarlo)
    dir: e2e
    cmds:
      - "{{.NPM}} run report"

  new_entity:
    desc: "Genera un CRUD completo. Ej: task new_entity -- Alumno nombre:String edad:Integer email:String?"
    cmds:
      - java tools/NewEntity.java {{.CLI_ARGS}}

  coverage:
    desc: Corre verify y muestra donde quedo el reporte de cobertura (JaCoCo)
    cmds:
      - "{{.MVN}} -B -ntp verify"
      - 'echo "Reporte: target/site/jacoco/index.html"'

  deps_updates:
    desc: Lista las dependencias con versiones nuevas disponibles
    cmds:
      - "{{.MVN}} -B -ntp versions:display-dependency-updates"

  sbom:
    desc: Genera el SBOM CycloneDX en target/bom.json (inventario de dependencias; no es un escaneo de vulnerabilidades)
    cmds:
      - "{{.MVN}} -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom"
      - 'echo "SBOM: target/bom.json"'

  doctor:
    desc: Muestra las versiones de las herramientas (Java, Maven, Docker, Node) y avisa si faltan las de Kubernetes
    cmds:
      - java -version
      - "{{.MVN}} -v"
      - docker --version
      - node --version
      - cmd: kubectl version --client || echo "FALTA kubectl en el PATH"
        ignore_error: true
      - cmd: minikube version --short || echo "FALTA minikube en el PATH (skaffold lo necesita para cargar la imagen en el cluster)"
        ignore_error: true
      - cmd: skaffold version || echo "FALTA skaffold en el PATH"
        ignore_error: true

  db_reset:
    desc: Borra y recrea la base local (pierde los datos locales)
    cmds:
      - docker compose down -v postgres
      - docker compose up -d --wait postgres

  clean:
    desc: Limpia target/
    cmds:
      - "{{.MVN}} -B clean"

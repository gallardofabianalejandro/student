# Overlay solo para minikube: base + Postgres como pod + secretos de desarrollo (no usar en ningun otro ambiente).
resources:
  - ../base
  - postgres.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: student-secrets
    literals:
      - DB_USERNAME=student
      - DB_PASSWORD=student
      - JWT_SECRET=local-dev-only-jwt-secret-change-me-0123456789abcdef

patches:
  - path: configmap-patch.yaml
  - path: deployment-patch.yaml

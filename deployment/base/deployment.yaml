apiVersion: apps/v1
kind: Deployment
metadata:
  name: student
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student
  template:
    metadata:
      labels:
        app: student
    spec:
      terminationGracePeriodSeconds: 60
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: cloud.google.com/gke-spot
                    operator: DoesNotExist
                  - key: cloud.google.com/gke-preemptible
                    operator: DoesNotExist
      containers:
        - name: student
          image: gallardofabian/student
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: student-config
          env:
            # Los Secret no se versionan: crearlos antes de desplegar (ver README, seccion Autenticacion).
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: student-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: student-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: student-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 1

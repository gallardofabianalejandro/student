name: E2E

# Pruebas de punta a punta (Playwright) contra una instancia ya desplegada. Se lanzan a mano:
# Actions > E2E > Run workflow, con la URL (por ejemplo la de Render).
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL de la instancia a probar (https://<servicio>.onrender.com)"
        required: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Pruebas
        run: npx playwright test
        env:
          BASE_URL: ${{ inputs.base_url }}

      - name: Reporte
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

name: E2E

# Pruebas de punta a punta (Playwright) contra una instancia ya desplegada. Se lanzan a mano:
# Actions > E2E > Run workflow, con la URL (por ejemplo la de Render).
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL de la instancia a probar (https://<servicio>.onrender.com)"
        required: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Pruebas
        run: npx playwright test
        env:
          BASE_URL: ${{ inputs.base_url }}

      - name: Reporte
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

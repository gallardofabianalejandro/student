name: E2E

# Pruebas de punta a punta (Playwright) contra una instancia ya desplegada. Se lanzan a mano:
# Actions > E2E > Run workflow, con la URL (por ejemplo la de Render).
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL de la instancia a probar (https://<servicio>.onrender.com)"
        required: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Pruebas
        run: npx playwright test
        env:
          BASE_URL: ${{ inputs.base_url }}

      - name: Reporte
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

name: Mutation testing

# PIT sobre domain/ y application/. Semanal y a pedido; no bloquea los PR. Reporte HTML como artefacto.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pit:
    name: PIT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: PIT
        env:
          # Lectura de platform-parent/starters desde GitHub Packages (.mvn/settings.xml). Crear el secreto PACKAGES_TOKEN.
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: mvn -B -ntp -Pmutation -Dskip.frontend=true test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Reporte
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pit-report
          path: target/pit-reports
          retention-days: 14

name: Build

on:
  push:
    branches: [ "main", "release", "fix/*", "feat/*" ]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".gitignore"
      - "renovate.json"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify
        env:
          # Lectura de platform-parent/starters desde GitHub Packages (.mvn/settings.xml). Crear el secreto PACKAGES_TOKEN.
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: mvn -B -ntp verify

      - name: Publish image (release branch)
        if: ${{ github.ref == 'refs/heads/release' }}
        env:
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          GH_PACKAGES_USER: ${{ github.actor }}
          GH_PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: mvn -B -DskipTests jib:build -Djib.to.image=${IMAGE_NAME}:${{ github.sha }}

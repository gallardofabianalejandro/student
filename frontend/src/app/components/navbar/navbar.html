<header class="nav">
  <div class="wrap nav-in">
    <a routerLink="/" class="brand">
      <span class="logo" aria-hidden="true">S</span>Spring Boot + Angular App
    </a>
    <nav class="nav-links" aria-label="Principal">
      @if (auth.isAuthenticated()) {
        <a routerLink="/dashboard" routerLinkActive="is-active" ariaCurrentWhenActive="page" class="nav-link">Dashboard</a>
        <a routerLink="/items" routerLinkActive="is-active" ariaCurrentWhenActive="page" class="nav-link">Items</a>
        <span class="user-chip"><span class="avatar" aria-hidden="true">{{ initial() }}</span>{{ auth.user()?.username }}</span>
        <button type="button" (click)="logout()" class="btn btn-ghost btn-sm">Salir</button>
      } @else {
        <a routerLink="/login" routerLinkActive="is-active" ariaCurrentWhenActive="page" class="nav-link">Ingresar</a>
        <a routerLink="/register" class="btn btn-primary btn-sm">Registrarse</a>
      }
      <button type="button" class="icon-btn" aria-label="Cambiar tema" [attr.aria-pressed]="theme.theme() === 'dark'" (click)="theme.toggle()">
        @if (theme.theme() === 'dark') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        }
      </button>
    </nav>
  </div>
</header>

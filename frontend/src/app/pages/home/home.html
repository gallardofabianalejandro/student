<section class="text-center">
  <h1 class="text-3xl font-bold">Bienvenido</h1>
  <p class="mt-3 text-slate-600"> Aplicación Spring Boot con interfaz Angular y autenticación JWT. (flujo de prueba)</p>
  <div class="mt-6">
    @if (auth.isAuthenticated()) {
      <a routerLink="/dashboard" class="rounded bg-slate-900 px-4 py-2 text-white hover:bg-slate-700">Ir al dashboard</a>
    } @else {
      <a routerLink="/login" class="rounded bg-slate-900 px-4 py-2 text-white hover:bg-slate-700">Ingresar</a>
    }
  </div>
</section>

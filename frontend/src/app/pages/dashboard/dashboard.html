<section>
  <h1 class="text-2xl font-bold">Dashboard</h1>
  @if (auth.user(); as user) {
    <p class="mt-4">Sesión iniciada como <strong>{{ user.username }}</strong>.</p>
    <ul class="mt-3 flex flex-wrap gap-2">
      @for (role of user.roles; track role) {
        <li class="rounded bg-slate-200 px-2 py-0.5 text-xs font-medium">{{ role }}</li>
      }
    </ul>
  }
  <p class="mt-6"><a class="rounded bg-slate-900 px-4 py-2 text-white hover:bg-slate-700" routerLink="/items">Ir a
    Items</a></p>
</section>

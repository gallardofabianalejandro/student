<div class="page-head">
  <div>
    <h1>Dashboard</h1>
    @if (auth.user(); as user) {
      <p class="muted" style="margin-top: 6px">Sesión iniciada como <strong style="color: var(--fg)">{{ user.username }}</strong>.</p>
    }
  </div>
</div>

<div class="grid-cards">
  @if (auth.user(); as user) {
    <section class="card stack" style="background-image: var(--grad-soft)">
      <h2>Tu sesión</h2>
      <p class="muted" style="font-size: 14px">Roles asignados a tu usuario</p>
      <ul class="roles">
        @for (role of user.roles; track role) {
          <li><span class="badge">{{ role }}</span></li>
        }
      </ul>
    </section>
  }
  <section class="card stack">
    <h2>Items</h2>
    <p class="muted" style="font-size: 14px">Creá, editá y eliminá los items de ejemplo.</p>
    <a class="btn btn-primary" routerLink="/items">Ir a Items</a>
  </section>
</div>

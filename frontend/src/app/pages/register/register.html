<section class="card card-auth">
  <h1>Crear cuenta</h1>
  <p class="muted" style="margin-top: 6px">Registrate para empezar a usar la aplicación.</p>
  <form [formGroup]="form" (ngSubmit)="submit()" class="stack" style="margin-top: 24px">
    <div>
      <label class="field" for="username">
        Usuario
        <input id="username" formControlName="username" autocomplete="username" class="input"
               [attr.aria-invalid]="fieldError('username') ? 'true' : null"
               [attr.aria-describedby]="fieldError('username') ? 'username-error' : null" />
      </label>
      @if (fieldError('username'); as message) {
        <p id="username-error" class="field-error">{{ message }}</p>
      }
    </div>
    <div>
      <label class="field" for="password">
        Contraseña (mínimo 8 caracteres)
        <input id="password" type="password" formControlName="password" autocomplete="new-password" class="input"
               [attr.aria-invalid]="fieldError('password') ? 'true' : null"
               [attr.aria-describedby]="fieldError('password') ? 'password-error' : null" />
      </label>
      @if (fieldError('password'); as message) {
        <p id="password-error" class="field-error">{{ message }}</p>
      }
    </div>
    @if (error(); as message) {
      <p role="alert" class="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        {{ message }}
      </p>
    }
    <button type="submit" [disabled]="form.invalid || loading()" class="btn btn-primary btn-block">
      {{ loading() ? 'Creando…' : 'Registrarse' }}
    </button>
  </form>
  <p class="muted" style="margin-top: 20px; font-size: 14px">¿Ya tenés cuenta? <a routerLink="/login">Ingresá</a></p>
</section>

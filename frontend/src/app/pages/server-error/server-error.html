<section class="err">
  <div class="err-code grad-text" aria-hidden="true">500</div>
  <h1>Algo salió mal de nuestro lado</h1>
  <p>No pudimos completar la operación. Probá de nuevo en unos minutos.</p>
  <div class="cta">
    <button type="button" class="btn btn-primary" (click)="retry()">Reintentar</button>
    <a routerLink="/" class="btn btn-ghost">Volver al inicio</a>
  </div>
</section>
